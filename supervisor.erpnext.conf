# api_embed — supervisor config for the IONOS box (host 1BC1CD8, user `erpnext`).
#
# This is the SECOND host. `supervisor.conf` in this repo targets the /home/pi
# layout — do not edit one to match the other; they are different machines.
#
# Install: copy to /etc/supervisor/conf.d/api_embed.conf, then
#   sudo supervisorctl reread && sudo supervisorctl update   # this RESTARTS the service
#
# Differences from supervisor.conf, all deliberate:
#   - user/paths under /home/erpnext instead of /home/pi
#   - binds 127.0.0.1, not 0.0.0.0 — nginx (api.espib.co/embed) is the only caller
#   - --workers 1, NOT 2: this process holds both multilingual-e5-large and
#     bge-reranker-v2-m3 in GPU memory. A second worker doubles the VRAM
#     footprint and buys no throughput — encoding already runs off the event
#     loop via anyio.to_thread.
#   - HF_HOME pinned so model downloads land in the erpnext cache
[program:api_embed]
command=/home/erpnext/api_embed_env/bin/uvicorn app.main:app --host 127.0.0.1 --port 6959 --workers 1 --timeout-keep-alive 600
directory=/home/erpnext/.services/api_embed
user=erpnext
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/home/erpnext/.services/api_embed/logs/supervisor_stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=PATH="/home/erpnext/api_embed_env/bin:/usr/local/bin:/usr/bin:/bin",PYTHONPATH="/home/erpnext/.services/api_embed",ROOT_PATH="/embed",HF_HOME="/home/erpnext/.cache/huggingface",TOKENIZERS_PARALLELISM="false"
startsecs=8
stopwaitsecs=30
stopasgroup=true
killasgroup=true
